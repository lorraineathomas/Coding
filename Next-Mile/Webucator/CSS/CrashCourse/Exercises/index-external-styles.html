<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../normalize.css" rel="stylesheet" />
    <title>Home Run Hitters</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body class="webucator">
    <table>
      <caption>
        All-time Home Run Records
      </caption>
      <thead>
        <tr>
          <th>Player</th>
          <th>Home Runs</th>
          <th>Team</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="steroids-era">Barry Bonds</td>
          <td>762</td>
          <td>Giants</td>
        </tr>
        <tr>
          <td>Hank Aaron</td>
          <td>755</td>
          <td>Braves</td>
        </tr>
        <tr>
          <td>Babe Ruth</td>
          <td>714</td>
          <td>Yankees</td>
        </tr>
        <tr>
          <td class="steroids-era">Alex Rodriguez</td>
          <td>696</td>
          <td>Yankees</td>
        </tr>
        <tr>
          <td>Albert Pujols</td>
          <td>679</td>
          <td>Dodgers</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Totals</td>
          <td>3,606</td>
          <td>N/A</td>
        </tr>
        <tr>
          <td colspan="3" id="key">*Steroids Era</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
