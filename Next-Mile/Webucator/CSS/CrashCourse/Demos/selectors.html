<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    p {
      font-size: 20px;
    }

    .highlighted {
      color: red;
    }

    #last {
      font-style: italic;
    }

    a[href^="mailto"] {
      color: green
    }

    * {
      color: #ccc;
    }

    h1,
    p {
      text-decoration: underline;
    }

    /* this is a comment */
  </style>
  <title>Selectors</title>
</head>
<body>
  <h1 class="highlighted">Page Title</h1>
  <p>This is a paragraph element with a
    <strong>strong element</strong> within it.
  </p>
  <p class="highlighted">This paragraph has class "highlighted"</p>
  <p>Here is an <a href="mailto:">email link</a> and a
    <a href="https://www.webucator.com">web link</a>
  </p>
  <p id="last">This paragraph has an id of "last"</p>
</body>
</html>
