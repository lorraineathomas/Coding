<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/66b27bfaa7.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-3 city-buttons">
          <form>
            <input type="submit" value="New York" />
            <br />
            <input type="submit" value="San Francisco" />
            <br />
            <input type="submit" value="Atlanta" />
            <br />
            <input type="submit" value="Berlin" />
            <br />
            <input type="submit" value="Amsterdam" />
          </form>
        </div>
        <div class="col-9 main">
          <form class="searchbar">
            <input type="text" placeholder="Enter a city..." />
            <input type="submit" value="Search" />
            <input type="submit" value="Current City" />
          </form>
          <div class="results">
            <span class="weather-icon"><i class="fas fa-cloud"></i></span>
            <span class="weather-temperature"> temperature</span>
            <span class="umbrella">Umbrella? Yes/No</span>
          </div>
          <div class="five-days">
            <!-- five cards with forecast -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
