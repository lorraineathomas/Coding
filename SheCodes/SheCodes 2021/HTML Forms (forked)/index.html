<!DOCTYPE html>
<html>
  <head>
    <title>She Codes Plus</title>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"
      crossorigin="anonymous"
    />
    <link href="src/styles.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <img src="images/logo.png" alt="She Codes Plus Logo" class="logo" />
    <h1>HTML Forms</h1>

    <h3>HTML Challenge 1</h3>
    <p>
      Create a login form with username field, a password field and a login
      button
    </p>

    <form>
      <input type="text" placeholder="Enter your username" />
      <input type="password" placeholder="Enter your password" />
      <input type="button" value="Login" />
    </form>

    <h3>HTML Challenge 2</h3>
    <p>Import Bootstrap and apply the form component styling</p>
    <div class="card">
      <div class="card-body">
      <form>
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Enter your username"
            autofocus
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Enter your password"
          />
        </div>
        <input type="submit" class="btn btn-primary" value="Login"></input>
      </form>
      </div>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
